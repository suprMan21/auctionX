name: auctionx_mobile
description: "AuctionX / Authentic Materials mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Auth + Backend
  supabase_flutter: ^2.8.3
  dio: ^5.7.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Functional
  dartz: ^0.10.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # NFC
  nfc_manager: ^4.1.1
  ndef_record: ^1.4.2

  # Connectivity
  connectivity_plus: ^6.1.3

  # Video Proof
  camera: ^0.11.0
  video_compress: ^3.1.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  video_player: ^2.9.2

  # Deep Links
  app_links: ^6.4.0

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  riverpod_annotation: ^2.6.1

flutter:
  uses-material-design: true
