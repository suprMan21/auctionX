name: authentic_materials
description: "Authentic Materials Creator app"
publish_to: 'none'
version: 0.1.0+8

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Auth + Backend
  supabase_flutter: ^2.18.3
  dio: ^5.7.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Functional
  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Storage
  flutter_secure_storage: ^11.2.0
  # NFC
  nfc_manager: ^4.1.1
  ndef_record: ^1.4.2

  # Connectivity
  # Video Proof
  camera: ^0.12.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  video_player: ^2.9.2

  # Sharing
  share_plus: ^13.3.1

  # QR Code
  qr_flutter: ^4.1.0

  # Deep Links
  app_links: ^6.4.0

  # Code generation annotations
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  passkeys: ^2.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#13131A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#13131A"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
