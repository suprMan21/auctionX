[project]
name = "tag-encoder"
version = "0.3.0"
description = "NTAG 424 DNA encoder core + CLI — real NXP AN12196 SDM (S-NFC3.5), KMS-derived chip keys. Write counterpart to the read-only tag-hq."
requires-python = ">=3.11"
# Pure-Python AES/CMAC core means NO runtime crypto dependency for SIM parity.
# pyscard is only needed for the Phase-2 live-reader path (extra below).
dependencies = []

[project.optional-dependencies]
# Phase 2 (live silicon): PC/SC reader I/O, KMS key derivation, NXP originality check.
hardware = ["pyscard>=2.0", "boto3>=1.34", "ecdsa>=0.19"]
dev = ["pytest>=8.0"]

[project.scripts]
tag-encoder = "tag_encoder.cli:main"

# Explicit, because iam/ and providers/ sit beside the package and break flat-layout discovery.
[tool.setuptools.packages.find]
include = ["tag_encoder*"]

[tool.pytest.ini_options]
# "." makes tag_encoder importable; ".." makes the sibling tag-hq package
# importable so the NDEF round-trip test can exercise tag_hq.parsers directly.
pythonpath = [".", "../tag-hq"]
testpaths = ["tests", "providers"]
